# ALETHEIA on Render
# Dashboard → New → Blueprint → connect this repo → apply render.yaml
#
# After first deploy, open aletheia-api → Environment and set:
#   GROQ_API_KEY (required unless using OpenRouter only)
#   GROQ_API_KEY_BACKUP (optional)
#   OPENROUTER_API_KEY (optional failover)
#
# Notes:
# - Free web services sleep when idle; Starter is recommended for enrichment jobs.
# - Qdrant is a private service (Starter). If your account cannot create pserv,
#   use Qdrant Cloud and set QDRANT_URL on aletheia-api to that cluster URL.
# - If you rename aletheia-api, update NEXT_PUBLIC_API_URL on aletheia-web.

databases:
  - name: aletheia-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: pserv
    name: aletheia-qdrant
    runtime: image
    plan: starter
    image:
      url: docker.io/qdrant/qdrant:v1.13.4
    disk:
      name: aletheia-qdrant-disk
      mountPath: /qdrant/storage
      sizeGB: 10

  - type: web
    name: aletheia-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aletheia-db
          property: connectionString
      - key: QDRANT_URL
        value: http://aletheia-qdrant:6333
      - key: QDRANT_COLLECTION
        value: product_chunks
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: JOB_WORKERS
        value: "2"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_BACKUP
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false

  - type: web
    name: aletheia-web
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://aletheia-api.onrender.com
