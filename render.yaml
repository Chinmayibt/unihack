# ALETHEIA — free-tier Render Blueprint
# Dashboard → New → Blueprint → connect repo → apply this file
#
# Set secrets on aletheia-api after create:
#   GROQ_API_KEY and/or OPENROUTER_API_KEY
#
# Free limits to know:
# - Web services sleep after ~15 min idle (cold start on next hit)
# - Free Postgres is time-limited on Render (check current policy)
# - No paid Qdrant service: API uses in-process Qdrant (:memory:)
#   Vectors reset when the API instance restarts/sleeps — fine for demos
# - If you rename aletheia-api, update NEXT_PUBLIC_API_URL on aletheia-web

databases:
  - name: aletheia-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: aletheia-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aletheia-db
          property: connectionString
      - key: QDRANT_URL
        value: ":memory:"
      - key: QDRANT_COLLECTION
        value: product_chunks
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: JOB_WORKERS
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_BACKUP
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false

  - type: web
    name: aletheia-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://aletheia-api.onrender.com
